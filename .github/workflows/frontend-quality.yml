name: Frontend quality checks

on:
  push:
    branches:
      - feature/facility-dashboard-redesign
  pull_request:
    branches:
      - feature/facility-dashboard-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, build, and browser regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Navigation regression
        run: bun run test:navigation

      - name: Mobile layout regression
        run: bun run test:mobile-layout
